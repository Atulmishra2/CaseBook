<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CaseBook - Courts Directory & Smart Selection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* =========================================
       CLEAN MINIMAL DESIGN SYSTEM (NO PILLS)
       ========================================= */
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      --accent: #0f172a;
      --accent-hover: #1e293b;
      --brand-green: #059669;
      --status-vacant: #d97706;
      --status-active: #059669;
      
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar - Minimal & Restrained */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .header-meta {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .container {
      max-width: 1100px;
      margin: 28px auto;
      padding: 0 20px;
    }

    /* Page Intro Section */
    .page-title-area {
      margin-bottom: 24px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text);
    }

    .stats-summary {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stats-summary span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .dot-active { width: 6px; height: 6px; background: var(--status-active); border-radius: 50%; }
    .dot-vacant { width: 6px; height: 6px; background: var(--status-vacant); border-radius: 50%; }

    /* Minimal Segmented Tab Switcher (No Pills) */
    .controls-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .tab-nav {
      display: flex;
      border-bottom: 1px solid var(--border);
      gap: 24px;
    }

    .tab-link {
      background: none;
      border: none;
      padding: 8px 0;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: color 0.15s ease;
      font-family: inherit;
    }

    .tab-link:hover {
      color: var(--text);
    }

    .tab-link.active {
      color: var(--text);
    }

    .tab-link.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--text);
    }

    .cadre-select {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    /* =========================================
       CUSTOM DROPDOWN (Clean Minimal Trigger)
       ========================================= */
    .dropdown-block {
      margin-bottom: 36px;
    }

    .dropdown-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
      letter-spacing: 0.1px;
    }

    .select-wrapper {
      position: relative;
      max-width: 500px;
    }

    .select-trigger {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      text-align: left;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .select-trigger:hover {
      border-color: #94a3b8;
    }

    .select-trigger.active {
      border-color: var(--text);
      box-shadow: 0 0 0 1px var(--text);
    }

    .trigger-details {
      display: flex;
      flex-direction: column;
      gap: 1px;
      overflow: hidden;
      padding-right: 12px;
    }

    .trigger-code-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .trigger-code {
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
    }

    .trigger-vacant-text {
      font-size: 11.5px;
      color: var(--status-vacant);
      font-weight: 600;
    }

    .trigger-title {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chevron-icon {
      color: var(--text-light);
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .select-trigger.active .chevron-icon {
      transform: rotate(180deg);
      color: var(--text);
    }

    /* Popover Menu */
    .dropdown-popover {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.12);
      z-index: 50;
      display: none;
      flex-direction: column;
      max-height: 380px;
    }

    .dropdown-popover.open {
      display: flex;
    }

    .search-input-wrap {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border-radius: 8px 8px 0 0;
    }

    .search-input-wrap svg {
      color: var(--text-light);
      flex-shrink: 0;
    }

    .search-input-wrap input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: transparent;
    }

    .options-scroll {
      overflow-y: auto;
      padding: 4px 0;
    }

    .options-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .options-scroll::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    /* Clean Category Header inside Dropdown */
    .category-divider {
      padding: 10px 14px 4px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-light);
      text-transform: uppercase;
    }

    .option-item {
      padding: 9px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.1s ease;
    }

    .option-item:hover {
      background: var(--border-subtle);
    }

    .option-item.selected {
      background: #f1f5f9;
    }

    .option-left {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .option-primary {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
    }

    .option-sub {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .text-vacant-indicator {
      font-size: 11.5px;
      color: var(--status-vacant);
      font-weight: 600;
      flex-shrink: 0;
    }

    .check-mark {
      color: var(--brand-green);
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    mark {
      background: #fef08a;
      color: inherit;
      padding: 0 1px;
      border-radius: 2px;
      font-weight: 600;
    }

    /* =========================================
       TABLE - Minimal & High Data Density
       ========================================= */
    .table-frame {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .table-caption-bar {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-heading {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .table-sub-count {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead th {
      background: var(--border-subtle);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.1s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #fafafa;
    }

    tbody tr.selected-row {
      background: #f8fafc;
    }

    tbody td {
      padding: 12px 18px;
      font-size: 13px;
      vertical-align: middle;
    }

    .col-num {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-light);
    }

    .col-title {
      font-weight: 600;
      color: var(--text);
    }

    .col-code-hint {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .col-cadre {
      color: var(--text-muted);
      font-size: 12.5px;
    }

    .status-text-active {
      color: var(--status-active);
      font-size: 12.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-text-vacant {
      color: var(--status-vacant);
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-row-select {
      background: none;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.1s;
    }

    .btn-row-select:hover {
      background: var(--border-subtle);
      border-color: #cbd5e1;
    }

    /* Mobile Bottom Sheet */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      z-index: 100;
      display: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .sheet-backdrop.open {
      display: block;
      opacity: 1;
    }

    .sheet-card {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      z-index: 101;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      padding-bottom: env(safe-area-inset-bottom, 16px);
      box-shadow: 0 -8px 24px rgba(0,0,0,0.12);
    }

    .sheet-backdrop.open .sheet-card {
      transform: translateY(0);
    }

    .sheet-top {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
    }

    .btn-sheet-close {
      background: none;
      border: none;
      font-size: 16px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
    }

    @media (max-width: 768px) {
      .container { padding: 0 14px; margin: 18px auto; }
      .select-wrapper { max-width: 100%; }
      .dropdown-popover { display: none !important; }
      .tab-nav { width: 100%; gap: 18px; }
      .tab-link { font-size: 13px; }
      .controls-strip { flex-direction: column; align-items: stretch; gap: 12px; }
      .cadre-select { width: 100%; }
      tbody td { padding: 10px 12px; font-size: 12.5px; }
      thead th { padding: 8px 12px; font-size: 11px; }
    }
  </style>
</head>

        hasCivil: true,
        hasCriminal: true
      },
      {
        id: 29,
        code: "A.C.J.J.D. - 1",
        cadre: "Junior Division",
        civilTitle: "Addl. Civil Judge Junior Division Court No. 1",
        criminalTitle: "Addl. Judicial Magistrate Court No. 1 (AJM 1st)",
        status: "VACANT",
        hasCivil: true,
        hasCriminal: true
      },
      {
        id: 30,
        code: "A.C.J.J.D. - 2",
        cadre: "Junior Division",
        civilTitle: "Addl. Civil Judge Junior Division Court No. 2",
        criminalTitle: "Addl. Judicial Magistrate Court No. 2 (AJM 2nd)",
        status: "VACANT",
        hasCivil: true,
        hasCriminal: true
      },
      {
        id: 6,
        code: "A.C.J.J.D. - 3",
        cadre: "Junior Division",
        civilTitle: "Add. Civil Judge Junior Division-3rd (Lakhimpur Kheri)",
        criminalTitle: "AJM-3rd Lakhimpur Kheri",
        status: "VACANT",
        hasCivil: true,
        hasCriminal: true
      },
      {
        id: 5,
        code: "A.C.J.J.D. - 4",
        cadre: "Junior Division",
        civilTitle: "Add. Civil Judge Junior Division Court No. 4",
        criminalTitle: "Addl. Judicial Magistrate Court No. 4 (AJM-4)",
        status: "ACTIVE",
        hasCivil: true,
        hasCriminal: true
      },
      {
        id: 2,
        code: "AJM-FTC-New",
        cadre: "Junior Division",
        civilTitle: "Add. Civil Judge Jr. Div. FTC-New",
        criminalTitle: "A.J.M. - F.T.C. - New",
        status: "ACTIVE",
        hasCivil: true,
        hasCriminal: true
      },
      {
        id: 7,
        code: "A.C.J.J.D. (FTC)",
        cadre: "Junior Division",
        civilTitle: "Add. Civil Judge Junior Division / FTC",
        criminalTitle: "Addl. Judicial Magistrate / FTC",
        status: "ACTIVE",
        hasCivil: true,
        hasCriminal: true
      },
      {
        id: 31,
        code: "Family Court",
        cadre: "Family Court",
        civilTitle: "Principal Judge, Family Court, Lakhimpur Kheri",
        criminalTitle: "Principal Judge, Family Court (125 CrPC Jurisdiction)",
        status: "ACTIVE",
        hasCivil: true,
        hasCriminal: true
      },
      {
        id: 32,
        code: "Family-1st-Addl",
        cadre: "Family Court",
        civilTitle: "1st Addl. Principal Judge, Family Court",
        criminalTitle: "1st Addl. Principal Judge, Family Court",
        status: "ACTIVE",
        hasCivil: true,
        hasCriminal: true
      }
    ];

    let currentMode = 'civil'; // 'civil' | 'criminal' | 'all'
    let selectedCadre = 'ALL';
    let selectedCourtId = 8;   // A.C.J.S.D. - 1

    const selectTrigger = document.getElementById('selectTrigger');
    const triggerDetails = document.getElementById('triggerDetails');
    const desktopPopover = document.getElementById('desktopPopover');
    const desktopSearch = document.getElementById('desktopSearch');
    const desktopOptions = document.getElementById('desktopOptions');
    
    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const btnSheetClose = document.getElementById('btnSheetClose');
    const mobileSearch = document.getElementById('mobileSearch');
    const mobileOptions = document.getElementById('mobileOptions');
    const tableBody = document.getElementById('tableBody');

    function highlightMatch(text, query) {
      if (!query) return text;
      const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return text.replace(re, '<mark>$1</mark>');
    }

    function getFilteredCourts(term = '') {
      const q = term.toLowerCase().trim();
      return courtsList.filter(c => {
        if (selectedCadre !== 'ALL' && c.cadre !== selectedCadre) return false;
        if (currentMode === 'civil' && !c.hasCivil) return false;
        if (currentMode === 'criminal' && !c.hasCriminal) return false;

        if (!q) return true;
        return c.code.toLowerCase().includes(q) ||
               c.civilTitle.toLowerCase().includes(q) ||
               c.criminalTitle.toLowerCase().includes(q) ||
               c.cadre.toLowerCase().includes(q);
      });
    }

    // Render Dropdown List
    function renderDropdown(container, q = '') {
      container.innerHTML = '';
      const list = getFilteredCourts(q);

      if (list.length === 0) {
        container.innerHTML = `<div style="padding: 16px; text-align: center; color: var(--text-light); font-size: 13px;">No court found</div>`;
        return;
      }

      // Group by Cadre
      const groups = {};
      list.forEach(c => {
        if (!groups[c.cadre]) groups[c.cadre] = [];
        groups[c.cadre].push(c);
      });

      for (const [cadreName, courts] of Object.entries(groups)) {
        const header = document.createElement('div');
        header.className = 'category-divider';
        header.innerText = cadreName;
        container.appendChild(header);

        courts.forEach(c => {
          const isSelected = selectedCourtId === c.id;
          const isVacant = c.status === 'VACANT';
          const div = document.createElement('div');
          div.className = `option-item ${isSelected ? 'selected' : ''}`;

          let displayPrimary = '';
          let displaySecondary = '';

          if (currentMode === 'civil') {
            displayPrimary = c.code;
            displaySecondary = c.civilTitle;
          } else if (currentMode === 'criminal') {
            displayPrimary = c.code;
            displaySecondary = c.criminalTitle;
          } else {
            displayPrimary = c.code;
            displaySecondary = c.civilTitle;
          }

          const vacantText = isVacant ? `<span class="text-vacant-indicator">• Vacant</span>` : '';

          div.innerHTML = `
            <div class="option-left">
              <div class="option-primary">
                <span>${highlightMatch(displayPrimary, q)}</span>
                ${vacantText}
              </div>
              <div class="option-sub">${highlightMatch(displaySecondary, q)}</div>
            </div>
            ${isSelected ? '<span class="check-mark">✓</span>' : ''}
          `;

          div.onclick = () => selectCourt(c);
          container.appendChild(div);
        });
      }
    }

    // Update Trigger (No Pills)
    function updateTrigger() {
      const c = courtsList.find(item => item.id === selectedCourtId) || courtsList[0];
      const isVacant = c.status === 'VACANT';

      let displayCode = c.code;
      let displayTitle = currentMode === 'criminal' ? c.criminalTitle : c.civilTitle;

      const vacantIndicator = isVacant ? `<span class="trigger-vacant-text">(Vacant)</span>` : '';

      triggerDetails.innerHTML = `
        <div class="trigger-code-row">
          <span class="trigger-code">${displayCode}</span>
          ${vacantIndicator}
        </div>
        <div class="trigger-title">${displayTitle}</div>
      `;
    }

    function selectCourt(court) {
      selectedCourtId = court.id;
      updateTrigger();
      renderTable();
      closeMenus();
    }

    function closeMenus() {
      desktopPopover.classList.remove('open');
      selectTrigger.classList.remove('active');
      sheetBackdrop.classList.remove('open');
      document.body.style.overflow = '';
      desktopSearch.value = '';
      mobileSearch.value = '';
      renderDropdown(desktopOptions);
      renderDropdown(mobileOptions);
    }

    // Render Table (No Pills)
    function renderTable() {
      tableBody.innerHTML = '';
      const list = getFilteredCourts();
      document.getElementById('tableCountText').innerText = `Showing ${list.length} courts`;

      list.forEach((c, idx) => {
        const isSelected = selectedCourtId === c.id;
        const isVacant = c.status === 'VACANT';
        const tr = document.createElement('tr');
        if (isSelected) tr.className = 'selected-row';

        let nameHTML = '';
        if (currentMode === 'civil') {
          nameHTML = `
            <div class="col-title">${c.civilTitle}</div>
            <div class="col-code-hint">${c.code}</div>
          `;
        } else if (currentMode === 'criminal') {
          nameHTML = `
            <div class="col-title">${c.criminalTitle}</div>
            <div class="col-code-hint">${c.code}</div>
          `;
        } else {
          nameHTML = `
            <div class="col-title">${c.civilTitle}</div>
            <div class="col-code-hint">Criminal: ${c.criminalTitle}</div>
          `;
        }

        const statusHTML = isVacant
          ? `<span class="status-text-vacant"><i class="dot-vacant"></i> Vacant</span>`
          : `<span class="status-text-active"><i class="dot-active"></i> Active</span>`;

        tr.innerHTML = `
          <td class="col-num">${idx + 1}</td>
          <td>${nameHTML}</td>
          <td class="col-cadre">${c.cadre}</td>
          <td>${statusHTML}</td>
          <td style="text-align: right;">
            <button type="button" class="btn-row-select" onclick="chooseCourt(${c.id})">
              ${isSelected ? 'Selected' : 'Select'}
            </button>
          </td>
        `;

        tableBody.appendChild(tr);
      });
    }

    window.chooseCourt = function(id) {
      const c = courtsList.find(item => item.id === id);
      if (c) selectCourt(c);
    };

    // Mode Tabs
    document.querySelectorAll('.tab-link').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab-link').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.getAttribute('data-mode');

        const lbl = document.getElementById('lblSelect');
        if (currentMode === 'civil') lbl.innerText = 'Select Civil Court';
        else if (currentMode === 'criminal') lbl.innerText = 'Select Criminal Court';
        else lbl.innerText = 'Select Court Forum';

        updateTrigger();
        renderDropdown(desktopOptions, desktopSearch.value);
        renderDropdown(mobileOptions, mobileSearch.value);
        renderTable();
      });
    });

    // Cadre Select
    document.getElementById('cadreSelect').addEventListener('change', (e) => {
      selectedCadre = e.target.value;
      renderDropdown(desktopOptions, desktopSearch.value);
      renderDropdown(mobileOptions, mobileSearch.value);
      renderTable();
    });

    // Dropdown open
    selectTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.innerWidth <= 768) {
        document.body.style.overflow = 'hidden';
        sheetBackdrop.classList.add('open');
        setTimeout(() => mobileSearch.focus(), 250);
      } else {
        desktopPopover.classList.toggle('open');
        selectTrigger.classList.toggle('active');
        if (desktopPopover.classList.contains('open')) desktopSearch.focus();
      }
    });

    desktopSearch.addEventListener('input', (e) => renderDropdown(desktopOptions, e.target.value));
    mobileSearch.addEventListener('input', (e) => renderDropdown(mobileOptions, e.target.value));

    btnSheetClose.addEventListener('click', closeMenus);
    sheetBackdrop.addEventListener('click', (e) => {
      if (e.target === sheetBackdrop) closeMenus();
    });

    document.addEventListener('click', (e) => {
      if (!selectTrigger.contains(e.target) && !desktopPopover.contains(e.target)) {
        if (desktopPopover.classList.contains('open')) closeMenus();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMenus();
    });

    // Initialize
    updateTrigger();
    renderDropdown(desktopOptions);
    renderDropdown(mobileOptions);
    renderTable();
  </script>
</body>
</html>
