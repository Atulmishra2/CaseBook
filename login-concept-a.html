<!DOCTYPE html>
<html lang="en" class="min-h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaseBook — Executive Chamber Vault</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Design Tokens & Resets -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/reset.css">

  <style>
    :root {
      --vault-bg: var(--slate-950);
      --vault-card: var(--slate-900);
      --vault-card-surface: rgba(30, 33, 50, 0.75);
      --vault-border: rgba(227, 179, 65, 0.22);
      --vault-border-subtle: rgba(255, 255, 255, 0.08);
      --vault-gold: var(--gold-400);
      --vault-text: var(--paper-50);
      --vault-text-muted: var(--slate-400);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* ─────────────────────────────────────────────────────────────
       ZERO-SCROLL VIEWPORT LOCKDOWN (DESKTOP)
       Desktop par exactly 100vh rahega, zero outer scrollbar.
       ───────────────────────────────────────────────────────────── */
    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      background-color: var(--vault-bg);
      color: var(--vault-text);
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    @media (min-width: 1024px) {
      html, body {
        height: 100vh !important;
        max-height: 100vh !important;
        overflow: hidden !important;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }

    /* Mobile / Small Screens: Smooth vertical scroll for virtual keyboards */
    @media (max-width: 1023px) {
      html, body {
        min-height: 100%;
        height: auto !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 14px 24px 14px;
      }
    }

    /* Ambient Architectural Grid & Glow Background */
    .vault-ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 10%, rgba(227, 179, 65, 0.1) 0%, transparent 60%),
        radial-gradient(circle at 85% 90%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 15% 85%, rgba(212, 160, 23, 0.04) 0%, transparent 45%);
    }

    .vault-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.03;
      background-image: 
        linear-gradient(to right, #ffffff 1px, transparent 1px),
        linear-gradient(to bottom, #ffffff 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(ellipse at center, #000 45%, transparent 80%);
      z-index: 0;
    }

    /* Floating Concept Switcher Top Bar */
    .concept-switcher-bar {
      position: fixed;
      top: 14px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 20, 31, 0.88);
      border: 1px solid var(--vault-border-subtle);
      border-radius: var(--radius-full);
      padding: 5px 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    }

    .concept-switcher-label {
      font-size: var(--text-2xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold-400);
      margin-right: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .concept-pill-btn {
      font-size: var(--text-xs);
      font-weight: 500;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      text-decoration: none;
      color: var(--slate-300);
      transition: all var(--transition-fast);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .concept-pill-btn:hover {
      color: var(--paper-50);
      background: rgba(255, 255, 255, 0.05);
    }

    .concept-pill-btn.active {
      background: rgba(227, 179, 65, 0.16);
      border-color: rgba(227, 179, 65, 0.35);
      color: var(--gold-300);
      font-weight: 600;
    }

    /* Main Container (Strictly Scaled for Zero Overflow) */
    .vault-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 0;
      margin: auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Floating Executive Vault Card - Compact Height Profile */
    .vault-card {
      width: 100%;
      background: linear-gradient(180deg, rgba(29, 32, 51, 0.88) 0%, rgba(18, 20, 31, 0.96) 100%);
      border: 1px solid var(--vault-border);
      border-radius: var(--radius-xl);
      padding: 22px 26px 18px 26px;
      box-shadow: 
        0 0 0 1px rgba(227, 179, 65, 0.08),
        0 20px 50px -12px rgba(0, 0, 0, 0.75),
        0 0 32px -6px rgba(212, 160, 23, 0.1);
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    /* Subtle Gold Rim Highlight on Top */
    .vault-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-400), transparent);
    }

    /* Chamber Emblem Header - Tight Vertical Profile */
    .chamber-emblem-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 14px;
    }

    .chamber-seal-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(227, 179, 65, 0.22) 0%, rgba(161, 98, 7, 0.12) 100%);
      border: 1px solid var(--vault-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-400);
      margin-bottom: 8px;
      box-shadow: 0 4px 16px -2px rgba(212, 160, 23, 0.25);
      position: relative;
    }

    .chamber-seal-icon::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: calc(var(--radius-lg) + 3px);
      border: 1px dashed rgba(227, 179, 65, 0.22);
    }

    .chamber-seal-icon .lucide {
      width: 22px;
      height: 22px;
      stroke-width: 2.2;
    }

    .chamber-eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-400);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chamber-eyebrow::before,
    .chamber-eyebrow::after {
      content: "";
      width: 12px;
      height: 1px;
      background: rgba(227, 179, 65, 0.35);
    }

    .vault-title {
      font-family: var(--font-sans);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--paper-50);
      margin: 0 0 3px 0;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .vault-desc {
      font-size: 11px;
      color: var(--vault-text-muted);
      margin: 0;
      line-height: 1.35;
    }

    /* 1-Tap Persona Role Switcher - Compact */
    .persona-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 14px;
      background: rgba(18, 20, 31, 0.65);
      padding: 3px;
      border-radius: var(--radius-md);
      border: 1px solid var(--vault-border-subtle);
    }

    .persona-tab {
      padding: 6px 4px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 500;
      color: var(--slate-400);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all var(--transition-fast);
      user-select: none;
    }

    .persona-tab .lucide {
      width: 13px;
      height: 13px;
    }

    .persona-tab:hover {
      color: var(--paper-100);
      background: rgba(255, 255, 255, 0.04);
    }

    .persona-tab.active {
      color: var(--gold-300);
      background: rgba(227, 179, 65, 0.14);
      border-color: rgba(227, 179, 65, 0.28);
      font-weight: 600;
    }

    /* Form Inputs - Compact & Ergonomic */
    .vault-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vault-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .vault-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .vault-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--paper-200);
    }

    .vault-helper-link {
      font-size: 10.5px;
      color: var(--gold-400);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .vault-helper-link:hover {
      color: var(--gold-300);
      text-decoration: underline;
    }

    .vault-input-box {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .vault-input-icon {
      position: absolute;
      left: 12px;
      color: var(--slate-500);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: color var(--transition-fast);
    }

    .vault-input-icon .lucide {
      width: 16px;
      height: 16px;
    }

    .vault-input {
      width: 100%;
      min-height: 40px;
      background: rgba(18, 20, 31, 0.7);
      border: 1px solid var(--vault-border-subtle);
      border-radius: var(--radius-md);
      padding: 8px 36px 8px 36px;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--paper-50);
      outline: none;
      transition: all var(--transition-fast);
    }

    .vault-input::placeholder {
      color: var(--slate-600);
    }

    .vault-input:hover {
      border-color: rgba(255, 255, 255, 0.16);
    }

    .vault-input:focus {
      background: rgba(24, 27, 43, 0.95);
      border-color: var(--gold-400);
      box-shadow: 0 0 0 3px rgba(227, 179, 65, 0.18), 0 0 14px -2px rgba(212, 160, 23, 0.25);
    }

    .vault-input:focus ~ .vault-input-icon {
      color: var(--gold-400);
    }

    .vault-eye-btn {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none;
      color: var(--slate-500);
      cursor: pointer;
      padding: 4px;
      border-radius: var(--radius-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .vault-eye-btn:hover {
      color: var(--paper-100);
      background: rgba(255, 255, 255, 0.06);
    }

    .vault-eye-btn .lucide {
      width: 15px;
      height: 15px;
    }

    /* Options Row */
    .vault-options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -2px;
    }

    .vault-remember-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      color: var(--slate-400);
      cursor: pointer;
      user-select: none;
    }

    .vault-remember-label input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: var(--gold-500);
      cursor: pointer;
    }

    .vault-kbd-hint {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--slate-500);
    }

    .vault-kbd-hint kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-xs);
      padding: 1px 5px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--slate-300);
    }

    /* Primary CTA Button with Rich Legal Brass Glow */
    .vault-submit-btn {
      width: 100%;
      min-height: 42px;
      background: linear-gradient(135deg, var(--gold-500) 0%, var(--gold-600) 100%);
      color: #0b0c11;
      border: 1px solid var(--gold-400);
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 
        0 0 16px -2px rgba(212, 160, 23, 0.45),
        0 4px 10px rgba(0, 0, 0, 0.25);
      transition: all var(--transition-fast);
      margin-top: 2px;
    }

    .vault-submit-btn:hover {
      background: linear-gradient(135deg, var(--gold-400) 0%, var(--gold-500) 100%);
      box-shadow: 
        0 0 22px -1px rgba(227, 179, 65, 0.65),
        0 6px 14px rgba(0, 0, 0, 0.35);
      transform: translateY(-1px);
    }

    .vault-submit-btn:active {
      transform: translateY(1px);
      box-shadow: 0 0 10px rgba(212, 160, 23, 0.3);
    }

    .vault-submit-btn .lucide {
      width: 16px;
      height: 16px;
      stroke-width: 2.2;
    }

    /* Vault Divider */
    .vault-divider {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0 10px;
    }

    .vault-divider-line {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
    }

    .vault-divider-line div {
      width: 100%;
      border-top: 1px solid var(--vault-border-subtle);
    }

    .vault-divider-text {
      position: relative;
      background: rgba(23, 25, 40, 0.96);
      padding: 0 10px;
      font-size: 10px;
      color: var(--slate-500);
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    /* Secondary Action: Guest Access */
    .vault-guest-btn {
      width: 100%;
      min-height: 36px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--vault-border-subtle);
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      color: var(--paper-200);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all var(--transition-fast);
    }

    .vault-guest-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.16);
      color: var(--paper-50);
      transform: translateY(-1px);
    }

    .vault-guest-btn .lucide {
      width: 14px;
      height: 14px;
      color: var(--gold-400);
    }

    /* Security Badge Footer - Ultra Compact */
    .vault-footer-security {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--vault-border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--slate-500);
    }

    .vault-security-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--slate-400);
    }

    .vault-security-pill .lucide {
      width: 12px;
      height: 12px;
      color: var(--gold-400);
    }

    .vault-status-dot {
      width: 5px;
      height: 5px;
      border-radius: var(--radius-full);
      background-color: var(--success-dark);
      box-shadow: 0 0 6px var(--success-dark);
      display: inline-block;
      margin-right: 3px;
    }
  </style>
</head>
<body>

  <!-- Ambient Backdrop -->
  <div class="vault-ambient" aria-hidden="true"></div>
  <div class="vault-grid" aria-hidden="true"></div>

  <!-- Interactive Prototype Switcher -->
  <nav class="concept-switcher-bar" aria-label="Prototype Navigation">
    <span class="concept-switcher-label">
      <svg class="lucide lucide-sparkles" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
      Prototypes
    </span>
    <a href="login-concept-a.html" class="concept-pill-btn active">
      <svg class="lucide lucide-shield" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
      Concept A: Chamber Vault
    </a>
    <a href="login-concept-b.html" class="concept-pill-btn">
      <svg class="lucide lucide-layout-list" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><path d="M14 4h7"/><path d="M14 9h7"/><path d="M14 15h7"/><path d="M14 20h7"/></svg>
      Concept B: Live Docket Split
    </a>
  </nav>

  <!-- Main Vault Workspace -->
  <main class="vault-container">
    <div class="vault-card">

      <!-- Chamber Emblem & Header -->
      <header class="chamber-emblem-wrap">
        <div class="chamber-seal-icon" aria-hidden="true">
          <svg class="lucide lucide-scale" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="M7 21h10"/>
            <path d="M12 3v18"/>
            <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
          </svg>
        </div>
        <div class="chamber-eyebrow">CaseBook Judicial Suite</div>
        <h1 class="vault-title">Chamber Authentication</h1>
        <p class="vault-desc">Restricted digital practice vault for designated advocates & registry staff.</p>
      </header>

      <!-- 1-Tap Persona Role Switcher -->
      <div class="persona-strip" role="tablist" aria-label="Select Role Profile">
        <button type="button" class="persona-tab active" id="personaAdmin" onclick="setPersona('admin', 'admin123', this)">
          <svg class="lucide lucide-crown" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.735H5.81a1 1 0 0 1-.957-.735L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></svg>
          <span>Senior Counsel</span>
        </button>
        <button type="button" class="persona-tab" id="personaMunshi" onclick="setPersona('munshi', 'chamber2026', this)">
          <svg class="lucide lucide-briefcase" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          <span>Munshi / Clerk</span>
        </button>
        <button type="button" class="persona-tab" id="personaGuest" onclick="setPersona('guest', 'guestpass', this)">
          <svg class="lucide lucide-glasses" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="15" r="4"/><circle cx="18" cy="15" r="4"/><path d="M14 15a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M2.5 13 5 7c.7-1.3 1.4-2 3-2"/><path d="M21.5 13 19 7c-.7-1.3-1.5-2-3-2"/></svg>
          <span>Guest Reader</span>
        </button>
      </div>

      <!-- Auth Form -->
      <form id="loginForm" class="vault-form" action="#" method="POST" novalidate onsubmit="event.preventDefault(); handleFormSubmit();">
        
        <!-- Username Field -->
        <div class="vault-field">
          <label for="email" class="vault-label">Advocate ID / Handle</label>
          <div class="vault-input-box">
            <span class="vault-input-icon">
              <svg class="lucide lucide-user-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
            </span>
            <input 
              type="text" 
              id="email" 
              name="email" 
              class="vault-input" 
              value="admin" 
              placeholder="e.g. adv.mishra or admin"
              autocomplete="username">
          </div>
        </div>

        <!-- Password Field -->
        <div class="vault-field">
          <div class="vault-label-row">
            <label for="password" class="vault-label">Chamber Passcode</label>
            <a href="#" onclick="alert('Passcode reset request dispatched to chamber administrator.'); return false;" class="vault-helper-link">Reset Passcode?</a>
          </div>
          <div class="vault-input-box">
            <span class="vault-input-icon">
              <svg class="lucide lucide-key-round" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="vault-input" 
              value="admin123" 
              placeholder="••••••••"
              autocomplete="current-password">
            <button type="button" id="togglePasswordBtn" class="vault-eye-btn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" class="lucide lucide-eye" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <!-- Options Row -->
        <div class="vault-options-row">
          <label class="vault-remember-label">
            <input id="remember-me" name="remember-me" type="checkbox" checked>
            <span>Persist Session</span>
          </label>
          <span class="vault-kbd-hint">
            <kbd>↵ Enter</kbd> to unlock
          </span>
        </div>

        <!-- Primary Submit CTA with Glow -->
        <button type="submit" id="submitBtn" class="vault-submit-btn">
          <span>Enter Chamber Vault</span>
          <svg class="lucide lucide-arrow-right" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>

      <!-- Divider -->
      <div class="vault-divider">
        <div class="vault-divider-line" aria-hidden="true"><div></div></div>
        <span class="vault-divider-text">OR PUBLIC ACCESS</span>
      </div>

      <!-- Secondary Guest CTA -->
      <button type="button" id="guestBtn" onclick="handleGuestAccess()" class="vault-guest-btn">
        <svg class="lucide lucide-shield-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Open Public Cause List & Inquiry</span>
      </button>

      <!-- Footer Info -->
      <footer class="vault-footer-security">
        <div class="vault-security-pill">
          <span class="vault-status-dot"></span>
          <span>Chamber Mesh Online</span>
        </div>
        <div>
          <span>256-Bit Hardware Keystore</span>
        </div>
      </footer>

    </div>
  </main>

  <script>
    // Persona Switcher
    function setPersona(user, pass, element) {
      document.querySelectorAll('.persona-tab').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');
      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('password');
      if (emailInput) emailInput.value = user;
      if (passInput) passInput.value = pass;
    }

    // Password Toggle
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    if (togglePasswordBtn && passwordInput && eyeIcon) {
      togglePasswordBtn.addEventListener('click', function() {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        if (isPassword) {
          eyeIcon.innerHTML = `
            <path d="m2 2 20 20"/>
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
          `;
        } else {
          eyeIcon.innerHTML = `
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          `;
        }
      });
    }

    // One-Click Authentication Handlers
    function handleFormSubmit() {
      const emailInput = document.getElementById('email');
      const email = (emailInput && emailInput.value) ? emailInput.value.trim() : 'admin';
      try {
        localStorage.setItem('cmUser', email || 'admin');
        localStorage.removeItem('cmExplicitLogout');
        sessionStorage.setItem('cmUser', email || 'admin');
      } catch (e) {}
      window.location.href = 'index.html';
    }

    function handleGuestAccess() {
      try {
        localStorage.setItem('cmUser', 'guest');
        sessionStorage.setItem('cmUser', 'guest');
      } catch (e) {}
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
