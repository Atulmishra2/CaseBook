<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casebook Management Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50">
    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar -->
      <aside class="w-64 bg-slate-900 text-white flex-shrink-0 hidden md:flex flex-col">
        <div class="p-6 text-2xl font-bold text-indigo-400">
          <i class="fas fa-book-medical mr-2"></i>
          Casebook
        </div>
        <nav class="flex-1 px-4 space-y-2">
          <a href="#" class="flex items-center p-3 bg-indigo-600 rounded-lg">
            <i class="fas fa-home mr-3"></i>
            Dashboard
          </a>
          <a href="#" class="flex items-center p-3 hover:bg-slate-800 rounded-lg transition">
            <i class="fas fa-folder mr-3"></i>
            All Cases
          </a>
          <a href="#" class="flex items-center p-3 hover:bg-slate-800 rounded-lg transition">
            <i class="fas fa-user-injured mr-3"></i>
            Patients
          </a>
          <a href="#" class="flex items-center p-3 hover:bg-slate-800 rounded-lg transition">
            <i class="fas fa-cog mr-3"></i>
            Settings
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 overflow-y-auto">
        <!-- Top Bar -->
        <header class="bg-white shadow-sm p-4 flex justify-between items-center">
          <h1 class="text-xl font-semibold text-slate-800">Overview</h1>
          <div class="flex items-center space-x-4">
            <button class="text-slate-500 hover:text-indigo-600">
              <i class="fas fa-bell"></i>
            </button>
            <div
              class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold"
            >
              AD
            </div>
          </div>
        </header>

        <!-- Dashboard Content -->
        <div class="p-6">
          <!-- Stats Cards -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
              <p class="text-slate-500 text-sm">Total Cases</p>
              <h3 class="text-3xl font-bold text-slate-800">1,284</h3>
            </div>
            <!-- More cards... -->
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
