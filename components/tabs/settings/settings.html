<div class="form-container">
    <div class="section-header-row">
        <div class="section-title-box">
            <div class="section-icon-badge"><i class="fa-solid fa-gear"></i></div>
            <div>
                <h3>System & Account Settings</h3>
                <p class="section-subtitle">Configure chambers profile, password security, backup preferences, and cloud database</p>
            </div>
        </div>
    </div>

    <!-- CLOUD DATABASE (SUPABASE) CONFIGURATION -->
    <div class="settings-card" style="background: var(--bg-panel-secondary, #152033); border: 1px solid var(--border-color, #233147); border-radius: 8px; padding: 1.25rem; margin-bottom: 2rem;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <div style="background: rgba(20, 184, 166, 0.15); color: #14b8a6; width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;">
                    <i class="fa-solid fa-cloud"></i>
                </div>
                <div>
                    <h4 style="margin: 0; font-size: 1rem; font-weight: 600; color: var(--text-primary, #fff);">Supabase Cloud Database</h4>
                    <p style="margin: 2px 0 0; font-size: 0.75rem; color: var(--text-muted, #94a3b8);">Credentials are stored securely in this browser only. Zero credentials are committed to GitHub.</p>
                </div>
            </div>
            <span id="supabaseConnBadge" style="font-size: 0.72rem; padding: 4px 10px; border-radius: 9999px; font-weight: 600; background: #334155; color: #94a3b8;">Checking...</span>
        </div>

        <form id="supabaseConfigForm" action="javascript:void(0);" onsubmit="return handleSaveSupabaseConfig(event);" style="display: flex; flex-direction: column; gap: 1rem;">
            <div class="form-group">
                <label for="supabaseProjectUrlInput" style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary, #94a3b8); text-transform: uppercase; letter-spacing: 0.05em;">PROJECT URL</label>
                <input type="url" id="supabaseProjectUrlInput" placeholder="https://your-project.supabase.co" class="form-input" style="font-size: 0.85rem;" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="supabaseAnonKeyInput" style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary, #94a3b8); text-transform: uppercase; letter-spacing: 0.05em;">ANON / PUBLIC API KEY</label>
                <div class="password-input-wrapper">
                    <input type="password" id="supabaseAnonKeyInput" placeholder="eyJhbGciOi... or sb_publishable_..." class="form-input" style="font-size: 0.85rem;" autocomplete="off">
                    <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility('supabaseAnonKeyInput', this)" title="Show/Hide Key"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>

            <div style="display: flex; gap: 0.75rem; align-items: center; margin-top: 0.25rem; flex-wrap: wrap;">
                <button type="submit" class="primary-btn form-submit-btn" style="min-height: 40px; padding: 0.5rem 1.25rem;"><i class="fa-solid fa-floppy-disk"></i> Save &amp; Connect</button>
                <button type="button" class="btn" onclick="handleClearSupabaseConfig()" style="min-height: 40px; padding: 0.5rem 1rem; background: transparent; border: 1px solid var(--border-color, #233147); color: #f43f5e;"><i class="fa-solid fa-trash"></i> Disconnect</button>
                <button type="button" class="btn" onclick="handleTestSupabaseConfig()" style="min-height: 40px; padding: 0.5rem 1rem; background: var(--bg-panel, #1e293b); border: 1px solid var(--border-color, #233147); color: var(--text-primary, #fff);"><i class="fa-solid fa-plug"></i> Test Connection</button>
            </div>
            <p id="supabaseConfigStatus" class="update-status-msg" style="margin-top: 4px; font-size: 0.82rem;"></p>
        </form>
    </div>

    <!-- ADMIN CREDENTIALS UPDATE FORM -->
    <form id="changePasswordForm" class="settings-form" action="javascript:void(0);" onsubmit="return handleChangeCredentials(event);">
        <div class="form-grid-2col">
            <div class="form-group" style="grid-column: 1 / -1;">
                <label for="currentAdminUsername">Active Username</label>
                <input type="text" id="currentAdminUsername" readonly class="locked-input" value="AtulMishra">
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label for="currentPassword">Current Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="currentPassword" placeholder="Enter current password" required>
                    <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility(this.getAttribute('data-target')||this.previousElementSibling.id, this)" title="Show/Hide Password"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label for="newUsername">New Username</label>
                <input type="text" id="newUsername" placeholder="Enter new username" required value="AtulMishra">
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="newPassword" placeholder="Enter new password" required minlength="4">
                    <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility(this.getAttribute('data-target')||this.previousElementSibling.id, this)" title="Show/Hide Password"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="confirmNewPassword" placeholder="Re-enter new password" required minlength="4">
                    <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility(this.getAttribute('data-target')||this.previousElementSibling.id, this)" title="Show/Hide Password"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>
        </div>

        <button type="submit" class="primary-btn form-submit-btn"><i class="fa-solid fa-paper-plane"></i> Submit Password Update</button>
        <p id="settingsStatus" class="update-status-msg"></p>
    </form>
</div>
