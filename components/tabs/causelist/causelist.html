<script src="https://unpkg.com/lucide@latest"></script>
<!-- ==============================================================================
     DAILY CAUSE LIST & APPEARANCE BOARD - MAIN CONTAINER
     ============================================================================== -->
<div class="causelist-container tab-card-wrapper" id="causelistContainer">
  <!-- ==============================================================================
       1. TOP BANNER / NAVIGATION CARD
       Contains: Icon, Main Title, Quick Action Chips, WhatsApp Button
       ============================================================================== -->
  <div class="causelist-banner-card">
    <div class="causelist-banner-left">
      <!-- Icon Badge (Document Icon) -->
      <div class="causelist-banner-icon-badge" aria-hidden="true">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
      </div>

      <!-- Titles and Quick Action Chips -->
      <div class="causelist-banner-titles">
        <h3 class="causelist-main-title">Daily Cause List &amp; Appearance Board</h3>

        <!-- Quick Action Chips Row (Today, Tomorrow, Print, Forward Date) -->
        <div class="header-chips-row">
          <!-- Chip 1: Today -->
          <button type="button" class="header-chip-btn" onclick="setCauseListDateOffset(0)">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="17" x2="12" y2="22"></line>
              <path
                d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a1 1 0 0 0 0-2H8a1 1 0 0 0 0 2h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"
              ></path>
            </svg>
            Today
          </button>

          <!-- Chip 2: Tomorrow -->
          <button type="button" class="header-chip-btn" onclick="setCauseListDateOffset(1)">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            Tomorrow
          </button>

          <!-- Chip 3: Print Cause List (A4) -->
          <button type="button" class="header-chip-btn" onclick="printDailyCauseList()">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path
                d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"
              ></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            Print Cause List (A4)
          </button>

          <!-- Chip 4: Forward Next Hearing Date -->
          <button
            type="button"
            class="header-chip-btn"
            onclick="openForwardDateModal()"
            title="Forward Next Hearing Date"
          >
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Forward Date
          </button>
        </div>
        <!-- End header-chips-row -->
      </div>
    </div>

    <!-- WhatsApp Action Button (Right Side) -->
    <div class="causelist-banner-actions">
      <button
        type="button"
        id="causeListWhatsAppActionBtn"
        class="whatsapp-send-btn causelist-btn"
        onclick="sendDailyCauseListWhatsApp()"
        title="Share today's cause list summary on WhatsApp"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
          ></path>
        </svg>
        WhatsApp Daily Schedule
      </button>
    </div>
  </div>
  <!-- End causelist-banner-card -->

  <!-- ==============================================================================
       2. CONTROLS TOOLBAR CARD
       Contains: Date Selector, Court Filter, Quick Date Presets
       ============================================================================== -->
  <div class="causelist-toolbar-card">
    <div class="causelist-toolbar-left">
      <!-- Date Selector Input -->
      <div class="causelist-date-selector">
        <label for="causeListDateInput" class="causelist-toolbar-label">
          Select Appearance Date:
        </label>
        <input
          type="date"
          id="causeListDateInput"
          class="causelist-date-input"
          onchange="
            renderCauseListTable(
              this.value,
              document.getElementById('causeListCourtFilterSelect')?.value,
            )
          "
        />
      </div>

      <!-- Court Filter Dropdown -->
      <div class="causelist-court-filter-wrap">
        <label for="causeListCourtFilterTrigger" class="causelist-toolbar-label">
          Filter by Court:
        </label>
        <div class="causelist-court-combobox" id="causeListCourtFilterWrapper">
          <button
            type="button"
            class="causelist-select-trigger"
            id="causeListCourtFilterTrigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            onclick="toggleCauseListCourtDropdown()"
          >
            <span id="causeListCourtFilterLabel">🏛️ All Courts</span>
            <svg class="causelist-select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <!-- Hidden native select retained for compatibility with existing filtering code. -->
          <select id="causeListCourtFilterSelect" class="form-select causelist-select" style="display: none;" aria-hidden="true">
            <option value="">🏛️ All Courts</option>
          </select>
          <div id="causeListCourtDropdown" class="causelist-combobox-results hidden">
            <div class="causelist-dropdown-search-wrapper">
              <span class="causelist-combobox-search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
              <input
                type="text"
                id="causeListCourtSearchInput"
                class="causelist-dropdown-search-input"
                placeholder="Search courts..."
                autocomplete="off"
                oninput="filterCauseListCourtDropdown(this.value)"
                onkeydown="handleCauseListCourtDropdownKeydown(event)"
              />
            </div>
            <ul id="causeListCourtOptionsList" class="causelist-court-options-list" role="listbox" aria-label="Courts"></ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Date Preset Buttons -->
    <div class="causelist-presets-wrap">
      <label class="causelist-toolbar-label">Quick Date:</label>
      <div class="causelist-preset-grid">
        <!-- Today -->
        <button
          type="button"
          class="preset-icon-btn"
          onclick="setCauseListDateOffset(0)"
          title="Today"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="12" y1="17" x2="12" y2="22"></line>
            <path
              d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a1 1 0 0 0 0-2H8a1 1 0 0 0 0 2h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"
            ></path>
          </svg>
        </button>

        <!-- Tomorrow -->
        <button
          type="button"
          class="preset-icon-btn"
          onclick="setCauseListDateOffset(1)"
          title="Tomorrow"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </button>

        <!-- In 2 Days -->
        <button
          type="button"
          class="preset-icon-btn"
          onclick="setCauseListDateOffset(2)"
          title="In 2 Days"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </button>

        <!-- Next Week -->
        <button
          type="button"
          class="preset-icon-btn"
          onclick="setCauseListDateOffset(7)"
          title="Next Week"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <path d="m9 16 2 2 4-4"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <!-- End causelist-toolbar-card -->

  <!-- ==============================================================================
       3. METRICS / STATS BAR
       Contains: Date Banner, Total/Civil/Criminal/Revenue Counters
       ============================================================================== -->
  <div class="causelist-stats-bar">
    <!-- Date Banner (Left) -->
    <div class="causelist-date-banner">
      <span class="banner-icon" aria-hidden="true">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="3" x2="12" y2="21"></line>
          <polyline points="2 7 12 3 22 7"></polyline>
          <path d="m5 12-3-5 3-5"></path>
          <path d="m19 12 3-5-3-5"></path>
          <path d="M5 12a4 4 0 0 0 4 4"></path>
          <path d="M19 12a4 4 0 0 1-4 4"></path>
        </svg>
      </span>
      <div class="banner-text-wrap">
        <h4 id="causeListBannerDateText">Listed Matters for Today</h4>
        <span id="causeListBannerDayName" class="banner-subtext">Loading day...</span>
      </div>
    </div>

    <!-- Counters (Right) -->
    <div class="causelist-counters-group">
      <span id="causeListTotalBadge" class="causelist-stat-pill total">0 Total Matters Listed</span>
      <span id="causeListCivilBadge" class="causelist-stat-pill civil">0 Civil</span>
      <span id="causeListCriminalBadge" class="causelist-stat-pill criminal">0 Criminal</span>
      <span id="causeListRevenueBadge" class="causelist-stat-pill revenue">0 Revenue</span>
    </div>
  </div>
  <!-- End causelist-stats-bar -->

  <!-- ==============================================================================
       4. DAILY CAUSE LIST CARDS CONTAINER
       This is where JavaScript will render the case cards dynamically.
       ============================================================================== -->
  <div id="causeListCardsContainer" class="causelist-cards">
    <!-- Default Empty/Loading State (Will be replaced by JS) -->
    <div class="causelist-empty">
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
        <line x1="8" y1="14" x2="16" y2="14"></line>
        <line x1="8" y1="18" x2="13" y2="18"></line>
      </svg>
      <span class="empty-title-text">Loading daily cause list...</span>
    </div>
  </div>
</div>
